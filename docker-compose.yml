services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: senior-developer-test-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1433:1433"

  api:
    build:
      context: .
      dockerfile: src/SeniorDeveloperTest.Api/Dockerfile
    container_name: senior-developer-test-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SeniorDeveloperTest;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver